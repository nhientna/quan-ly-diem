<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm Điểm Nhanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #888; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden text-sm">
    
    <!-- Thanh Header trên cùng -->
    <div class="bg-blue-700 text-white p-2 flex justify-between items-center shadow-md z-10">
        <div class="font-bold truncate max-w-[25%] text-xs">Lớp Học</div>
        <div class="flex gap-1">
            <!-- Nút Kết thúc buổi cho toàn bộ lớp -->
            <button onclick="endSessionAll()" class="bg-indigo-500 hover:bg-indigo-600 px-2 py-1 rounded text-xs font-bold shadow"><i class="fas fa-check-double"></i> Kết thúc</button>
            <button onclick="addStudent()" class="bg-green-500 hover:bg-green-600 px-2 py-1 rounded text-xs shadow"><i class="fas fa-plus"></i> Thêm</button>
            <button onclick="resetAll()" class="bg-red-500 hover:bg-red-600 px-2 py-1 rounded text-xs shadow"><i class="fas fa-trash"></i> Reset</button>
        </div>
    </div>

    <!-- Sơ đồ chỗ ngồi (Lưới học viên) -->
    <div class="flex-1 overflow-y-auto p-2 bg-gray-50">
        <div id="student-grid" class="grid grid-cols-3 gap-2">
            <!-- Render danh sách vào đây -->
        </div>
    </div>

    <!-- Thanh thao tác cố định ở dưới -->
    <div class="bg-white border-t border-gray-300 p-2 shadow-[0_-2px_10px_rgba(0,0,0,0.1)] z-10">
        <div class="text-center mb-1 text-xs font-bold text-gray-700 h-4" id="selection-status">
            Vui lòng chọn 1 học viên
        </div>
        
        <!-- Các nút cộng/trừ điểm -->
        <div class="flex justify-center gap-1 mb-2">
            <button onclick="updatePoints(0.25)" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-1.5 rounded border border-blue-200">+0.25</button>
            <button onclick="updatePoints(1)" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-1.5 rounded border border-blue-200">+1</button>
            <button onclick="updatePoints(-1)" class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 font-bold py-1.5 rounded border border-red-200">-1</button>
            <button onclick="updatePoints(-3)" class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 font-bold py-1.5 rounded border border-red-200">-3</button>
        </div>

        <!-- Các nút hành động khác -->
        <div class="flex justify-center gap-1">
            <button onclick="redeemPoints()" class="flex-2 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xs py-1.5 px-4 rounded font-bold w-2/3"><i class="fas fa-gift"></i> Đổi thưởng</button>
            <button onclick="removeStudent()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 text-xs py-1.5 rounded w-1/3" title="Xóa học viên này"><i class="fas fa-user-times"></i> Xóa</button>
        </div>
    </div>

    <!-- Hộp thoại Modal Custom -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg p-4 w-11/12 max-w-xs shadow-xl">
            <p id="modal-message" class="text-sm text-gray-800 mb-4 text-center"></p>
            <div id="modal-input-container" class="hidden mb-4">
                <input type="text" id="modal-input" class="w-full border rounded p-1 text-center text-sm" />
            </div>
            <div class="flex justify-center gap-2">
                <button id="modal-cancel" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-1 rounded text-sm">Hủy</button>
                <button id="modal-confirm" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded text-sm font-bold">Đồng ý</button>
            </div>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let selectedId = null;

        // --- Hệ thống Hộp thoại Modal ---
        let modalConfirmAction = null;

        function showModal(message, onConfirm, isInput = false, inputPlaceholder = "") {
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('custom-modal').classList.remove('hidden');
            
            const inputContainer = document.getElementById('modal-input-container');
            const inputField = document.getElementById('modal-input');
            
            if (isInput) {
                inputContainer.classList.remove('hidden');
                inputField.value = "";
                inputField.placeholder = inputPlaceholder;
                inputField.focus();
            } else {
                inputContainer.classList.add('hidden');
            }

            modalConfirmAction = () => {
                const val = isInput ? inputField.value : null;
                onConfirm(val);
                closeModal();
            };
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            modalConfirmAction = null;
        }

        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-confirm').addEventListener('click', () => {
            if (modalConfirmAction) modalConfirmAction();
        });

        // --- Logic Ứng dụng ---
        function saveAndRender() {
            localStorage.setItem('students', JSON.stringify(students));
            render();
            updateSelectionStatus();
        }

        function selectStudent(id) {
            selectedId = id;
            render();
            updateSelectionStatus();
        }

        function updateSelectionStatus() {
            const statusDiv = document.getElementById('selection-status');
            if (selectedId === null) {
                statusDiv.innerText = "Vui lòng chọn 1 học viên";
                statusDiv.className = "text-center mb-1 text-xs font-bold text-gray-500 h-4";
            } else {
                const student = students.find(s => s.id === selectedId);
                if (student) {
                    statusDiv.innerHTML = `Đang thao tác: <span class="text-blue-700">${student.name}</span>`;
                    statusDiv.className = "text-center mb-1 text-xs font-bold h-4 bg-blue-50 inline-block px-3 rounded-full border border-blue-200";
                }
            }
        }

        function addStudent() {
            showModal("Nhập tên học viên mới:", (name) => {
                if (name && name.trim() !== "") {
                    students.push({ id: Date.now(), name: name.trim(), currentSession: 0, totalTerm: 0 });
                    saveAndRender();
                }
            }, true, "VD: Nguyễn Văn A");
        }

        function removeStudent() {
            if (!selectedId) {
                showModal("Vui lòng chọn học viên cần xóa ở sơ đồ trên trước!", () => {});
                return;
            }
            const student = students.find(s => s.id === selectedId);
            showModal(`Xóa học viên <b>${student.name}</b> khỏi lớp?`, () => {
                students = students.filter(s => s.id !== selectedId);
                selectedId = null;
                saveAndRender();
            });
        }

        function updatePoints(points) {
            if (!selectedId) {
                showModal("Vui lòng chọn 1 học viên trước khi bấm điểm!", () => {});
                return;
            }
            const student = students.find(s => s.id === selectedId);
            if (student) {
                student.currentSession += points;
                saveAndRender();
            }
        }

        function endSessionAll() {
            if (students.length === 0) return;
            showModal("Xác nhận <b>KẾT THÚC BUỔI HỌC</b>?<br><br>Điểm 'buổi này' của <b>TẤT CẢ</b> học viên sẽ được cộng dồn vào 'Tổng kỳ' và reset về 0.", () => {
                students.forEach(s => {
                    s.totalTerm += s.currentSession;
                    s.currentSession = 0;
                });
                selectedId = null;
                saveAndRender();
            });
        }

        function redeemPoints() {
            if (!selectedId) {
                showModal("Vui lòng chọn học viên cần đổi thưởng!", () => {});
                return;
            }
            const student = students.find(s => s.id === selectedId);
            if (student) {
                showModal(`<b>${student.name}</b> có <b>${student.totalTerm}</b> tổng điểm.<br>Nhập số điểm muốn đổi (trừ đi):`, (val) => {
                    const points = parseFloat(val);
                    if (!isNaN(points) && points > 0) {
                        if (points <= student.totalTerm) {
                            student.totalTerm -= points;
                            saveAndRender();
                        } else {
                            showModal("Lỗi: Số điểm muốn đổi vượt quá tổng điểm đang có!", () => {});
                        }
                    }
                }, true, "Nhập số điểm...");
            }
        }

        function resetAll() {
            showModal("<span class='text-red-600 font-bold'>CẢNH BÁO NGUY HIỂM!</span><br>Xóa trắng toàn bộ điểm buổi học và học kỳ của TẤT CẢ học viên về 0?", () => {
                students.forEach(s => {
                    s.currentSession = 0;
                    s.totalTerm = 0;
                });
                saveAndRender();
            });
        }

        function render() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';
            
            students.forEach(student => {
                const isSelected = student.id === selectedId;
                const card = document.createElement('div');
                card.className = `cursor-pointer border rounded p-2 text-center transition-all ${
                    isSelected ? 'bg-blue-100 border-blue-600 shadow-md ring-2 ring-blue-500 scale-[0.98]' : 'bg-white border-gray-200 hover:bg-gray-50'
                }`;
                card.onclick = () => selectStudent(student.id);
                
                card.innerHTML = `
                    <div class="font-bold text-gray-800 truncate mb-1" title="${student.name}">${student.name}</div>
                    <div class="text-[11px] flex justify-between border-t border-gray-200 pt-1 mt-1">
                        <span class="text-blue-600 font-bold">B: ${student.currentSession}</span>
                        <span class="text-green-600 font-bold">K: ${student.totalTerm}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        render();
        updateSelectionStatus();
    </script>
</body>
</html>
