<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Điểm Học Viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-6 bg-blue-600 text-white flex justify-between items-center flex-wrap gap-4">
            <h1 class="text-2xl font-bold">Hệ Thống Điểm Thưởng</h1>
            <div class="flex gap-2">
                <button onclick="addStudent()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded font-semibold transition"><i class="fas fa-plus mr-1"></i> Thêm Học Viên</button>
                <button onclick="resetAll()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-semibold transition"><i class="fas fa-trash-alt mr-1"></i> Reset Cả Kỳ</button>
            </div>
        </div>

        <div class="p-6">
            <div id="student-list" class="space-y-6">
                <!-- Danh sách học viên sẽ hiển thị ở đây -->
            </div>
        </div>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('students')) || [];

        function saveAndRender() {
            localStorage.setItem('students', JSON.stringify(students));
            render();
        }

        function addStudent() {
            const name = prompt("Nhập tên học viên mới:");
            if (name && name.trim() !== "") {
                students.push({ id: Date.now(), name: name.trim(), currentSession: 0, totalTerm: 0 });
                saveAndRender();
            }
        }

        function removeStudent(id) {
            if (confirm("Xóa học viên này khỏi danh sách?")) {
                students = students.filter(s => s.id !== id);
                saveAndRender();
            }
        }

        function updateSession(id, points) {
            const student = students.find(s => s.id === id);
            if (student) {
                student.currentSession += points;
                saveAndRender();
            }
        }

        function endSession(id) {
            const student = students.find(s => s.id === id);
            if (student) {
                student.totalTerm += student.currentSession;
                student.currentSession = 0;
                saveAndRender();
            }
        }

        function redeemPoints(id) {
            const student = students.find(s => s.id === id);
            if (student) {
                const pointsToRedeem = parseFloat(prompt(`Học viên ${student.name} có ${student.totalTerm} điểm tổng. Nhập số điểm muốn đổi thưởng:`));
                if (!isNaN(pointsToRedeem) && pointsToRedeem > 0) {
                    if (pointsToRedeem <= student.totalTerm) {
                        student.totalTerm -= pointsToRedeem;
                        saveAndRender();
                    } else {
                        alert("Số điểm đổi thưởng lớn hơn tổng điểm hiện có!");
                    }
                }
            }
        }

        function resetAll() {
            if (confirm("CẢNH BÁO: Hành động này sẽ xóa toàn bộ điểm của TẤT CẢ học viên về 0. Bạn có chắc chắn?")) {
                students.forEach(s => {
                    s.currentSession = 0;
                    s.totalTerm = 0;
                });
                saveAndRender();
            }
        }

        function render() {
            const container = document.getElementById('student-list');
            container.innerHTML = '';
            
            if (students.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center italic">Chưa có học viên nào. Hãy nhấn "Thêm Học Viên".</p>';
                return;
            }

            students.forEach(student => {
                const card = document.createElement('div');
                card.className = "border rounded-lg p-4 bg-gray-50 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4";
                card.innerHTML = `
                    <div class="flex items-center gap-3 w-full md:w-1/3">
                        <button onclick="removeStudent(${student.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-times-circle text-xl"></i></button>
                        <h2 class="text-lg font-bold text-gray-800">${student.name}</h2>
                    </div>
                    
                    <div class="w-full md:w-1/3 text-center border-x border-gray-200 px-4">
                        <p class="text-sm text-gray-500 mb-2">Điểm buổi này: <span class="text-xl font-bold text-blue-600 ml-1">${student.currentSession}</span></p>
                        <div class="flex justify-center flex-wrap gap-2 mb-2">
                            <button onclick="updateSession(${student.id}, 0.25)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded text-sm font-semibold">+0.25</button>
                            <button onclick="updateSession(${student.id}, 1)" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded text-sm font-semibold">+1</button>
                            <button onclick="updateSession(${student.id}, -1)" class="bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded text-sm font-semibold">-1</button>
                            <button onclick="updateSession(${student.id}, -3)" class="bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded text-sm font-semibold">-3</button>
                        </div>
                        <button onclick="endSession(${student.id})" class="w-full bg-gray-800 hover:bg-gray-900 text-white px-3 py-1 rounded text-sm transition">Kết thúc buổi học</button>
                    </div>

                    <div class="w-full md:w-1/3 text-center">
                        <p class="text-sm text-gray-500 mb-2">Tổng học kỳ: <span class="text-xl font-bold text-green-600 ml-1">${student.totalTerm}</span></p>
                        <button onclick="redeemPoints(${student.id})" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 px-4 py-2 rounded text-sm font-bold w-full transition"><i class="fas fa-gift mr-1"></i> Đổi thưởng</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Khởi chạy giao diện ban đầu
        render();
    </script>
</body>
</html>
